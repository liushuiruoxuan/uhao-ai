# Uhao-API Docker Compose — MySQL 版 + 本地构建
#
# 使用方法:
#   1. 将此文件和 docker-compose.override.yml 放到服务器上项目根目录
#   2. 复制 .env.production 为 .env 并修改密码
#   3. docker compose -f docker-compose.mysql.yml --env-file .env up -d
#   4. 访问 http://<服务器IP>:3000
#
# 密码通过环境变量注入，默认值为 Aa-111111!，生产环境务必修改！


services:
  uhao-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: uhao-api:local
    container_name: uhao-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "80:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=root:${MYSQL_ROOT_PASSWORD:-Aa-111111!}@tcp(mysql:3306)/uhao-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-Aa-111111!}@redis:6379
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=${NODE_NAME:-uhao-api-node-1}
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - uhao-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Aa-111111!}"]
    networks:
      - uhao-api-network

  mysql:
    image: mysql:8.2
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Aa-111111!}
      MYSQL_DATABASE: uhao-api
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uhao-api-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Aa-111111!}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

networks:
  uhao-api-network:
    driver: bridge
